# Builds the app and publishes it on GitHub Pages.
# Runs automatically whenever something is saved (committed) to the main branch,
# e.g. after you edit config.js. You can also start it by hand: Actions → "Publish website" → Run workflow.
name: Publish website

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One update at a time; a newer save waits for the running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check config.js (Supabase details)
        run: node .github/scripts/check-config.mjs config.js

      - name: Find the website address
        id: pages
        uses: actions/configure-pages@v6

      - name: Install
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: app
        env:
          # "/dasara-utsav" for https://<user>.github.io/dasara-utsav/ , empty for a custom domain
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npx vite build

      - name: Add config.js
        run: cp config.js app/dist/config.js

      - name: Upload the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
